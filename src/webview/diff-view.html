<!DOCTYPE html>
<html lang="en" data-theme="{{theme}}" data-mode="{{mode}}">

<!-- Template filled by getWebviewContent in src/render.ts; diff-view.css, diff-view.js and out/diff.js are inlined -->
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; media-src {{cspSource}} https:; font-src {{cspSource}}; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <base href="{{baseHref}}">
  {{mathStyle}}
  <style>{{css}}</style>
</head>

<body>
  <div class="paths">
    <div style="flex: 0 0 10px"></div>
    <!-- &lrm; on both ends keeps leading "/" and trailing ")" from jumping sides under rtl -->
    <div class="path" title="{{pathA}}">&lrm;{{pathA}}&lrm;</div>
    <div class="mode-slot"><button id="modeToggle" hidden></button></div>
    <div class="path" title="{{pathB}}">&lrm;{{pathB}}&lrm;</div>
  </div>
  <div class="main">
    <div class="ruler" id="leftRuler"><div class="ruler-viewport"></div></div>
    <div class="pane" id="leftPane"><div class="lines">{{textA}}</div></div>
    <div class="gutter">
      <canvas id="canvas"></canvas>
    </div>
    <div class="pane" id="rightPane"><div class="lines">{{textB}}</div></div>
    <div class="ruler" id="rightRuler"><div class="ruler-viewport"></div></div>
  </div>

  <script nonce="{{nonce}}">var exports = {};{{diffJs}}</script>
  <script nonce="{{nonce}}">const CONFIG = {{config}};</script>
  <script nonce="{{nonce}}">{{js}}</script>
</body>

</html>
