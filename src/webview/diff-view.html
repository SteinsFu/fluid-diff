<!DOCTYPE html>
<html lang="en" data-theme="{{theme}}">

<head>
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #d4d4d4;
      --chrome: #252526;
      --muted: #858585;
      --viewport: rgba(255, 255, 255, 0.5);
      --viewport-border: #ffffff;
      --gap: rgba(200, 200, 200, 0.8);
      --insert: 140, 200, 140;
      --delete: 240, 140, 140;
      --replace: 240, 215, 140;
      --ruler-mark-insert: rgba(98, 227, 104, 0.7);
      --ruler-mark-delete: rgba(240, 90, 90, 0.7);
      --ruler-mark-replace: rgba(255, 207, 75, 0.7);
      --word-insert: rgba(80, 200, 80, 0.2);
      --word-delete: rgba(255, 135, 135, 0.2);
      --word-replace: rgba(255, 210, 86, 0.2);
      --word-insert-underline: rgba(80, 200, 80, 0.5);
      --word-delete-underline: rgba(240, 90, 90, 0.5);
      --word-replace-underline: rgba(224, 184, 74, 0.5);
      --word-gap-insert: rgb(80, 200, 80);
      --word-gap-delete: rgb(240, 90, 90);
      --gap-before: rgba(200, 200, 200, 0.8);
      --gap-after: rgba(200, 200, 200, 0.8);
      --gutter: #252526;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --fg: #333333;
      --chrome: #f3f3f3;
      --muted: #6e6e6e;
      --viewport: rgba(0, 0, 0, 0.12);
      --viewport-border: #333333;
      --gap: rgba(80, 80, 80, 0.45);
      --insert: 30, 140, 60;
      --delete: 200, 40, 40;
      --replace: 160, 120, 0;
      --ruler-mark-insert: rgba(30, 140, 60, 0.7);
      --ruler-mark-delete: rgba(200, 40, 40, 0.7);
      --ruler-mark-replace: rgba(190, 140, 0, 0.7);
      --word-insert: rgba(30, 140, 60, 0.2);
      --word-delete: rgba(200, 40, 40, 0.2);
      --word-replace: rgba(190, 140, 0, 0.2);
      --word-insert-underline: rgba(30, 140, 60, 0.6);
      --word-delete-underline: rgba(200, 40, 40, 0.6);
      --word-replace-underline: rgba(160, 120, 0, 0.6);
      --word-gap-insert: rgb(30, 140, 60);
      --word-gap-delete: rgb(200, 40, 40);
      --gap-before: rgba(80, 80, 80, 0.45);
      --gap-after: rgba(80, 80, 80, 0.45);
      --gutter: #f3f3f3;
    }
    html[data-theme="dracula"] {
      --bg: #282a36;
      --fg: #f8f8f2;
      --chrome: #21222c;
      --muted: #6272a4;
      --viewport: rgba(68, 71, 90, 0.6);
      --viewport-border: #bd93f9;
      --gap: rgba(98, 114, 164, 0.9);
      --insert: 80, 250, 123;
      --delete: 255, 85, 85;
      --replace: 241, 250, 140;
      --ruler-mark-insert: rgba(80, 250, 123, 0.7);
      --ruler-mark-delete: rgba(255, 85, 85, 0.7);
      --ruler-mark-replace: rgba(241, 250, 140, 0.7);
      --word-insert: rgba(80, 250, 123, 0.2);
      --word-delete: rgba(255, 85, 85, 0.2);
      --word-replace: rgba(241, 250, 140, 0.2);
      --word-insert-underline: rgba(80, 250, 123, 0.6);
      --word-delete-underline: rgba(255, 85, 85, 0.6);
      --word-replace-underline: rgba(241, 250, 140, 0.6);
      --word-gap-insert: rgb(80, 250, 123);
      --word-gap-delete: rgb(255, 85, 85);
      --gap-before: rgba(98, 114, 164, 0.9);
      --gap-after: rgba(98, 114, 164, 0.9);
      --gutter: #21222c;
    }

    body {
      display: flex;
      font-family: monospace;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      overflow: hidden;
    }

    .pane {
      flex: 0 0 calc(50% - 30px - 10px); /* half width - half gutter - ruler width */
      width: calc(50% - 30px - 10px);
      min-width: 0;
      overflow: auto;
      padding: 10px 0;
      white-space: pre;
      position: relative;
      box-sizing: border-box;
      scrollbar-width: none;
    }

    .pane::-webkit-scrollbar {
      display: none;
    }

    #leftRuler {
      flex: 0 0 10px; 
      position: relative; 
      background: var(--chrome);
    }
    #rightRuler {
      flex: 0 0 10px; 
      position: relative; 
      background: var(--chrome);
    }
    /* Viewport follows current window scroll position */
    #leftRulerViewport {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--viewport);
      border: 1px solid var(--viewport-border);
      z-index: 99;
    }
    #rightRulerViewport {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--viewport);
      border: 1px solid var(--viewport-border);
      z-index: 99;
    }
    .ruler-mark {
      background-color: currentColor;
      position: absolute;
      width: 100%;
      min-height: 2px;
    }
    .ruler-mark-insert { color: var(--ruler-mark-insert); }
    .ruler-mark-delete { color: var(--ruler-mark-delete); }
    .ruler-mark-replace { color: var(--ruler-mark-replace); }
    .ruler-mark:hover {
      filter: brightness(1.4);
      box-shadow: 0 0 0 2px currentColor;
      z-index: 10;
      cursor: pointer;
    }

    /* LINE_HEIGHT and PANE_PAD in the script must match these */
    .line {
      height: 20px;
      line-height: 20px;
    }

    /* As wide as the longest line, so every row's background spans the full scroll width */
    .lines {
      width: max-content;
      min-width: 100%;
    }

    .line-num {
      display: inline-block;
      width: 5ch;
      margin-right: 1ch;
      text-align: right;
      color: var(--muted);
      user-select: none;
    }

    /* The chunk backgrounds */
    .chunk-insert { background: rgba(var(--insert), 0.2); }
    .chunk-delete { background: rgba(var(--delete), 0.2); }
    .chunk-replace { background: rgba(var(--replace), 0.2); }
    
    /* The word highlights */
    .word-insert, .word-delete, .word-replace {
      display: inline-block;
      height: 20px;
      line-height: 20px;
      vertical-align: top;
    }
    .word-insert {
      background: var(--word-insert);
      box-shadow: inset 0 -1px 0 var(--word-insert-underline);
      border-radius: 2px;
    }
    .word-delete {
      background: var(--word-delete);
      box-shadow: inset 0 -1px 0 var(--word-delete-underline);
      border-radius: 2px;
    }
    .word-replace {
      background: var(--word-replace);
      box-shadow: inset 0 -1px 0 var(--word-replace-underline);
      border-radius: 2px;
    }

    /* The gap indicators */
    .word-gap-insert, .word-gap-delete { 
      display: inline-block;
      width: 0;
      height: 20px;
      vertical-align: top;
      position: relative;
    }
    .word-gap-insert { box-shadow: 0 0 0 1px var(--word-gap-insert); }
    .word-gap-delete { box-shadow: 0 0 0 1px var(--word-gap-delete); }

    /* The gap indicators arrow */
    .word-gap-insert::before, .word-gap-delete::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -4px;
      border: 4px solid transparent;
    }
    .word-gap-insert::before { border-top-color: var(--word-gap-insert); }
    .word-gap-delete::before { border-top-color: var(--word-gap-delete); }

    .gap-before { box-shadow: inset 0 1px 0 var(--gap-before); }
    .gap-after { box-shadow: inset 0 -1px 0 var(--gap-after); }

    /* The fluid gutter holding our connecting curves */
    .gutter {
      flex: 0 0 60px;
      width: 60px;
      background: var(--gutter);
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="leftRuler"><div id="leftRulerViewport"></div></div>
  <div class="pane" id="leftPane"><div class="lines">{{textA}}</div></div>
  <div class="gutter">
    <canvas id="canvas"></canvas>
  </div>
  <div class="pane" id="rightPane"><div class="lines">{{textB}}</div></div>
  <div id="rightRuler"><div id="rightRulerViewport"></div></div>

  <script>
    const leftPane = document.getElementById('leftPane');
    const rightPane = document.getElementById('rightPane');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const chunks = JSON.parse('{{chunks}}');
    const LINE_HEIGHT = 20;
    const PANE_PAD = 10;
    const rootStyle = getComputedStyle(document.documentElement);
    const COLORS = Object.fromEntries(['insert', 'delete', 'replace'].map(t => [t, rootStyle.getPropertyValue(`--${t}`).trim()]));

    // Draw ruler marks & viewports
    drawRulerMarks();
    function drawRulerMarks() {
      const leftRuler = document.getElementById('leftRuler');
      const rightRuler = document.getElementById('rightRuler');
      const nA = leftPane.querySelectorAll('.line').length;    // number of lines in left pane
      const nB = rightPane.querySelectorAll('.line').length;   // number of lines in right pane
      
      for (const c of chunks) {
        // left pane ruler (only draw marks for non-empty chunks)
        if (c.a0 !== c.a1) {
          const m = document.createElement('div');
          m.className = `ruler-mark ruler-mark-${c.tag}`;
          m.style.top = (c.a0 / nA) * 100 + '%';
          m.style.height = (c.a1 - c.a0) / nA * 100 + '%';
          leftRuler.appendChild(m);
        }
        // right pane ruler (only draw marks for non-empty chunks)
        if (c.b0 !== c.b1) {
          const m = document.createElement('div');
          m.className = `ruler-mark ruler-mark-${c.tag}`;
          m.style.top = (c.b0 / nB) * 100 + '%';
          m.style.height = (c.b1 - c.b0) / nB * 100 + '%';
          rightRuler.appendChild(m);
        }
      }
    }
    function drawRulerViewports() {
      const leftViewport = document.getElementById('leftRulerViewport');
      const rightViewport = document.getElementById('rightRulerViewport');
      leftViewport.style.top = leftPane.scrollTop / leftPane.scrollHeight * 100 + '%';
      leftViewport.style.height = leftPane.clientHeight / leftPane.scrollHeight * 100 + '%';
      rightViewport.style.top = rightPane.scrollTop / rightPane.scrollHeight * 100 + '%';
      rightViewport.style.height = rightPane.clientHeight / rightPane.scrollHeight * 100 + '%';
    }
    function jumpTo(e, ruler, pane) {
      const r = ruler.getBoundingClientRect();
      pane.scrollTop = (e.clientY - r.top) / r.height * pane.scrollHeight - pane.clientHeight / 2;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.parentElement.clientWidth * dpr;
      canvas.height = canvas.parentElement.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawConnections();
      drawRulerViewports();
    }

    // Line boundary k (top of line k) in viewport pixels; lines have fixed height, so no DOM lookups.
    const yOf = (pane, k) => PANE_PAD + k * LINE_HEIGHT - pane.scrollTop;

    // Each chunk is a filled band whose edges are Bezier curves joining the left and right line ranges.
    function drawConnections() {
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, w, h);
      for (const c of chunks) {
        const ly0 = yOf(leftPane, c.a0), ly1 = yOf(leftPane, c.a1);
        const ry0 = yOf(rightPane, c.b0), ry1 = yOf(rightPane, c.b1);
        if (Math.max(ly1, ry1) < 0 || Math.min(ly0, ry0) > h) continue;
        const rgb = COLORS[c.tag];
        ctx.beginPath();
        ctx.moveTo(0, ly0);
        ctx.bezierCurveTo(w / 2, ly0, w / 2, ry0, w, ry0);
        ctx.lineTo(w, ry1);
        ctx.bezierCurveTo(w / 2, ry1, w / 2, ly1, 0, ly1);
        ctx.closePath();
        ctx.fillStyle = `rgba(${rgb}, 0.3)`;
        ctx.fill();
        // Stroke only the top and bottom curves. The left and right edges stay unstroked.
        ctx.beginPath();
        ctx.moveTo(0, ly0);
        ctx.bezierCurveTo(w / 2, ly0, w / 2, ry0, w, ry0);
        ctx.moveTo(0, ly1);
        ctx.bezierCurveTo(w / 2, ly1, w / 2, ry1, w, ry1);
        ctx.strokeStyle = `rgb(${rgb})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Matching line boundaries on both sides; between them, lines map linearly.
    // Unchanged stretches map 1:1, so inside a chunk the side with fewer lines moves slower.
    const anchors = [[0, 0], ...chunks.flatMap(c => [[c.a0, c.b0], [c.a1, c.b1]])];

    // Map a fractional line position from one side (0 = left, 1 = right) to the other.
    function mapLine(line, from) {
      const to = 1 - from;
      let i = 0;
      while (i + 1 < anchors.length && anchors[i + 1][from] <= line) i++;
      const [p, q] = [anchors[i], anchors[i + 1]];
      if (!q) return p[to] + (line - p[from]);
      return p[to] + (line - p[from]) / (q[from] - p[from]) * (q[to] - p[to]);
    }

    // Sync on the line at the vertical middle of the viewport.
    const midLine = pane => (pane.scrollTop + pane.clientHeight / 2 - PANE_PAD) / LINE_HEIGHT;
    const expected = new Map();
    function syncFrom(src, dst, from) {
      // Ignore the scroll event our own assignment below triggers on dst.
      const e = expected.get(src);
      if (e && Math.abs(src.scrollTop - e[0]) < 1 && Math.abs(src.scrollLeft - e[1]) < 1) {
        expected.delete(src);
      } else {
        syncTo(src, dst, from);
      }
      scheduleDraw();
    }
    function syncTo(src, dst, from) {
      const [top, left] = [dst.scrollTop, dst.scrollLeft];
      dst.scrollTop = mapLine(midLine(src), from) * LINE_HEIGHT + PANE_PAD - dst.clientHeight / 2;
      dst.scrollLeft = src.scrollLeft;
      if (dst.scrollTop !== top || dst.scrollLeft !== left) expected.set(dst, [dst.scrollTop, dst.scrollLeft]);
    }

    // Native wheel scrolling runs on the compositor and paints the panes a frame ahead of the canvas,
    // so scroll both panes and redraw in the same frame on the main thread instead.
    let wheel = null;
    function onWheel(e, src, dst, from) {
      e.preventDefault();
      const k = e.deltaMode === 1 ? LINE_HEIGHT : e.deltaMode === 2 ? src.clientHeight : 1;
      if (!wheel) {
        wheel = { src, dst, from, dx: 0, dy: 0 };
        requestAnimationFrame(applyWheel);
      }
      wheel.dx += e.deltaX * k;
      wheel.dy += e.deltaY * k;
    }
    function applyWheel() {
      const { src, dst, from, dx, dy } = wheel;
      wheel = null;
      const [top, left] = [src.scrollTop, src.scrollLeft];
      src.scrollTop += dy;
      src.scrollLeft += dx;
      if (src.scrollTop !== top || src.scrollLeft !== left) expected.set(src, [src.scrollTop, src.scrollLeft]);
      syncTo(src, dst, from);
      drawConnections();
      drawRulerViewports();
    }

    // Both panes fire scroll events per user scroll; draw once per frame.
    let drawPending = false;
    function scheduleDraw() {
      if (drawPending) return;
      drawPending = true;
      requestAnimationFrame(() => { 
        drawPending = false; 
        drawConnections(); 
        drawRulerViewports();
      });
    }
    leftPane.addEventListener('scroll', () => syncFrom(leftPane, rightPane, 0));
    rightPane.addEventListener('scroll', () => syncFrom(rightPane, leftPane, 1));
    // Rulers
    leftRuler.addEventListener('pointerdown', (e) => {
      leftRuler.setPointerCapture(e.pointerId);
      jumpTo(e, leftRuler, leftPane);
    });
    leftRuler.addEventListener('pointermove', (e) => {
      if (e.buttons & 1) jumpTo(e, leftRuler, leftPane);
    });
    rightRuler.addEventListener('pointerdown', (e) => {
      rightRuler.setPointerCapture(e.pointerId);
      jumpTo(e, rightRuler, rightPane);
    });
    rightRuler.addEventListener('pointermove', (e) => {
      if (e.buttons & 1) jumpTo(e, rightRuler, rightPane);
    });
    for (const el of [leftPane, leftRuler]) el.addEventListener('wheel', e => onWheel(e, leftPane, rightPane, 0), { passive: false });
    for (const el of [rightPane, rightRuler]) el.addEventListener('wheel', e => onWheel(e, rightPane, leftPane, 1), { passive: false });

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
  </script>
</body>

</html>
