<!DOCTYPE html>
<html lang="en" data-theme="{{theme}}" data-mode="{{mode}}">

<head>
  <base href="{{previewBaseHref}}">
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #d4d4d4;
      --chrome: #252526;
      --muted: #858585;
      --viewport: rgba(255, 255, 255, 0.5);
      --viewport-border: #ffffff;
      --gap: rgba(200, 200, 200, 0.8);
      --outline-insert: 140, 200, 140;
      --outline-delete: 240, 140, 140;
      --outline-replace: 240, 215, 140;
      --chunk-insert: rgb(52, 64, 52);
      --chunk-delete: rgb(72, 52, 52);
      --chunk-replace: rgb(72, 67, 52);
      --ruler-mark-insert: rgba(98, 227, 104, 0.7);
      --ruler-mark-delete: rgba(240, 90, 90, 0.7);
      --ruler-mark-replace: rgba(255, 207, 75, 0.7);
      --word-insert: rgba(80, 200, 80, 0.2);
      --word-delete: rgba(255, 135, 135, 0.2);
      --word-replace: rgba(255, 210, 86, 0.2);
      --word-insert-underline: rgba(80, 200, 80, 0.5);
      --word-delete-underline: rgba(240, 90, 90, 0.5);
      --word-replace-underline: rgba(224, 184, 74, 0.5);
      --word-gap-insert: rgb(80, 200, 80);
      --word-gap-delete: rgb(240, 90, 90);
      --gap-before: rgba(200, 200, 200, 0.8);
      --gap-after: rgba(200, 200, 200, 0.8);
      --gutter: #252526;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --fg: #000000;
      --chrome: #f2f2f2;
      --muted: #999999;
      --viewport: rgba(0, 0, 0, 0.1);
      --viewport-border: #888888;
      --gap: rgba(120, 120, 120, 0.5);
      --outline-insert: 40, 190, 20;
      --outline-delete: 230, 60, 60;
      --outline-replace: 250, 160, 0;
      --chunk-insert: rgb(212, 242, 208);
      --chunk-delete: rgb(250, 216, 216);
      --chunk-replace: rgb(254, 236, 204);
      --ruler-mark-insert: rgba(40, 190, 20, 0.6);
      --ruler-mark-delete: rgba(230, 60, 60, 0.6);
      --ruler-mark-replace: rgba(250, 160, 0, 0.6);
      --word-insert: rgba(40, 190, 20, 0.3);
      --word-delete: rgba(230, 60, 60, 0.3);
      --word-replace: rgba(250, 160, 0, 0.35);
      --word-insert-underline: rgba(40, 190, 20, 0.7);
      --word-delete-underline: rgba(230, 60, 60, 0.7);
      --word-replace-underline: rgba(220, 140, 0, 0.7);
      --word-gap-insert: rgb(40, 190, 20);
      --word-gap-delete: rgb(230, 60, 60);
      --gap-before: rgba(120, 120, 120, 0.5);
      --gap-after: rgba(120, 120, 120, 0.5);
      --gutter: #f2f2f2;
    }
    html[data-theme="dracula"] {
      --bg: #282a36;
      --fg: #f8f8f2;
      --chrome: #21222c;
      --muted: #6272a4;
      --viewport: rgb(77, 68, 90, 0.2);
      --viewport-border: #bd93f9;
      --gap: rgba(98, 114, 164, 0.9);
      --outline-insert: 80, 250, 123;
      --outline-delete: 255, 85, 85;
      --outline-replace: 241, 250, 140;
      --chunk-insert: rgb(48, 84, 68);
      --chunk-delete: rgb(83, 51, 60);
      --chunk-replace: rgb(80, 84, 71);
      --ruler-mark-insert: rgba(80, 250, 123, 0.7);
      --ruler-mark-delete: rgba(255, 85, 85, 0.7);
      --ruler-mark-replace: rgba(241, 250, 140, 0.7);
      --word-insert: rgba(80, 250, 123, 0.2);
      --word-delete: rgba(255, 85, 85, 0.2);
      --word-replace: rgba(241, 250, 140, 0.2);
      --word-insert-underline: rgba(80, 250, 123, 0.6);
      --word-delete-underline: rgba(255, 85, 85, 0.6);
      --word-replace-underline: rgba(241, 250, 140, 0.6);
      --word-gap-insert: rgb(80, 250, 123);
      --word-gap-delete: rgb(255, 85, 85);
      --gap-before: rgba(98, 114, 164, 0.9);
      --gap-after: rgba(98, 114, 164, 0.9);
      --gutter: #21222c;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: monospace;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* File path bars, column widths mirror .main (ruler, pane, gutter, pane, ruler) */
    .paths {
      display: flex;
      background: var(--chrome);
      border-bottom: 1px solid var(--gap);
    }
    /* Sits above the gutter, same 60px width */
    .mode-slot {
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #modeToggle {
      padding: 0 4px;
      font-size: 11px;
      border: 1px solid var(--gap);
      border-radius: 4px;
      background: var(--chrome);
      color: var(--muted);
      cursor: pointer;
    }
    #modeToggle:hover { color: var(--fg); border-color: var(--fg); }
    .path {
      flex: 0 0 calc(50% - 30px - 10px);
      min-width: 0;
      padding: 3px 1ch;
      box-sizing: border-box;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* rtl puts the ellipsis on the left so the file name stays visible; text-align keeps short paths left-aligned */
      direction: rtl;
      text-align: left;
    }

    .pane {
      flex: 0 0 calc(50% - 30px - 10px); /* half width - half gutter - ruler width */
      width: calc(50% - 30px - 10px);
      min-width: 0;
      overflow: auto;
      padding: 10px 0;
      white-space: pre;
      position: relative;
      box-sizing: border-box;
      scrollbar-width: none;
    }

    .pane::-webkit-scrollbar {
      display: none;
    }

    #leftRuler {
      flex: 0 0 10px; 
      position: relative; 
      background: var(--chrome);
    }
    #rightRuler {
      flex: 0 0 10px; 
      position: relative; 
      background: var(--chrome);
    }
    /* Viewport follows current window scroll position */
    #leftRulerViewport {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--viewport);
      border: 1px solid var(--viewport-border);
      z-index: 99;
    }
    #rightRulerViewport {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--viewport);
      border: 1px solid var(--viewport-border);
      z-index: 99;
    }
    .ruler-mark {
      background-color: currentColor;
      position: absolute;
      width: 100%;
      min-height: 2px;
    }
    .ruler-mark-insert { color: var(--ruler-mark-insert); }
    .ruler-mark-delete { color: var(--ruler-mark-delete); }
    .ruler-mark-replace { color: var(--ruler-mark-replace); }
    .ruler-mark:hover {
      filter: brightness(1.4);
      box-shadow: 0 0 0 2px currentColor;
      z-index: 10;
      cursor: pointer;
    }

    /* LINE_HEIGHT and PANE_PAD in the script must match these */
    .line {
      height: 20px;
      line-height: 20px;
      padding-right: 60px;
      background: var(--bg);
    }

    /* As wide as the longest line, so every row's background spans the full scroll width */
    .lines {
      width: max-content;
      min-width: 100%;
    }

    /* Markdown preview: wrap to pane width (max-content would never wrap). flow-root stops the first
       block's top margin collapsing out of .lines, which would shift it off PANE_PAD. */
    html[data-mode="preview"] .lines {
      display: flow-root;
      position: relative;
      width: auto;
      box-sizing: border-box;  /* min-width: 100% plus padding would overflow the pane */
      padding: 0 16px;
      white-space: normal;
      font-family: var(--vscode-font-family, sans-serif);
      font-size: 14px;
      line-height: 1.5;
    }
    /* Positioned content paints above the bands, which come first in the DOM */
    html[data-mode="preview"] .lines > :not(.band):not(.chunk-actions-container) { position: relative; }
    html[data-mode="preview"] .lines img { max-width: 100%; }
    html[data-mode="preview"] .lines a { color: var(--vscode-textLink-foreground, #3794ff); }
    html[data-mode="preview"] .lines code { font-family: monospace; background: rgba(128, 128, 128, 0.15); border-radius: 3px; padding: 0 3px; }
    html[data-mode="preview"] .lines pre { padding: 8px; background: rgba(128, 128, 128, 0.15); border-radius: 4px; overflow-x: auto; }
    html[data-mode="preview"] .lines pre code { background: none; padding: 0; }
    html[data-mode="preview"] .lines table { border-collapse: collapse; }
    html[data-mode="preview"] .lines th, html[data-mode="preview"] .lines td { border: 1px solid var(--gap); padding: 2px 8px; }
    html[data-mode="preview"] .lines blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--gap); color: var(--muted); }
    /* Word marks in preview flow inline so a mark can wrap across lines */
    html[data-mode="preview"] .word-insert, html[data-mode="preview"] .word-delete, html[data-mode="preview"] .word-replace {
      display: inline;
      height: auto;
      line-height: inherit;
      vertical-align: baseline;
    }
    html[data-mode="preview"] .word-gap-insert, html[data-mode="preview"] .word-gap-delete { height: 1.2em; vertical-align: text-bottom; }
    /* Chunk backgrounds in preview, positioned from the line-to-pixel table */
    .band { position: absolute; left: 0; right: 0; }
    .band.gap { border-top: 1px solid rgba(var(--outline), var(--outline-alpha, 1)); }

    .line-num {
      display: inline-block;
      width: 5ch;
      padding-right: 1ch;
      text-align: right;
      color: var(--muted);
      user-select: none;
      /* Pinned during horizontal scroll; copies the row's background and outline so text slides under it */
      position: sticky;
      left: 0;
      z-index: 1;
      background: inherit;
      box-shadow: inherit;
    }

    /* The chunk backgrounds */
    .chunk-insert { background: var(--chunk-insert); --outline: var(--outline-insert); }
    .chunk-delete { background: var(--chunk-delete); --outline: var(--outline-delete); }
    .chunk-replace { background: var(--chunk-replace); --outline: var(--outline-replace); }

    /* Chunk outlines: top edge of first line, bottom edge of last line, matching the gutter curves */
    .chunk-start { box-shadow: inset 0 1px 0 rgba(var(--outline), var(--outline-alpha, 1)); }
    .chunk-end { box-shadow: inset 0 -1px 0 rgba(var(--outline), var(--outline-alpha, 1)); }
    .chunk-start.chunk-end { box-shadow: inset 0 1px 0 rgba(var(--outline), var(--outline-alpha, 1)), inset 0 -1px 0 rgba(var(--outline), var(--outline-alpha, 1)); }
    
    /* The word highlights */
    .word-insert, .word-delete, .word-replace {
      display: inline-block;
      height: 20px;
      line-height: 20px;
      vertical-align: top;
    }
    .word-insert {
      background: var(--word-insert);
      box-shadow: inset 0 -1px 0 var(--word-insert-underline);
      border-radius: 2px;
    }
    .word-delete {
      background: var(--word-delete);
      box-shadow: inset 0 -1px 0 var(--word-delete-underline);
      border-radius: 2px;
    }
    .word-replace {
      background: var(--word-replace);
      box-shadow: inset 0 -1px 0 var(--word-replace-underline);
      border-radius: 2px;
    }

    /* The gap indicators */
    .word-gap-insert, .word-gap-delete { 
      display: inline-block;
      width: 0;
      height: 20px;
      vertical-align: top;
      position: relative;
    }
    .word-gap-insert { box-shadow: 0 0 0 1px var(--word-gap-insert); }
    .word-gap-delete { box-shadow: 0 0 0 1px var(--word-gap-delete); }

    /* The gap indicators arrow */
    .word-gap-insert::before, .word-gap-delete::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -4px;
      border: 4px solid transparent;
    }
    .word-gap-insert::before { border-top-color: var(--word-gap-insert); }
    .word-gap-delete::before { border-top-color: var(--word-gap-delete); }

    .gap-before { box-shadow: inset 0 1px 0 var(--gap-before); }
    .gap-after { box-shadow: inset 0 -1px 0 var(--gap-after); }

    /* The fluid gutter holding our connecting curves */
    .gutter {
      flex: 0 0 60px;
      width: 60px;
      background: var(--gutter);
      position: relative;
    }

    /* Chunk actions: revert, stage */
    .chunk-actions-container {
      position: sticky;
      left: 0;
      width: calc(50vw - 40px);
      height: 0;
      z-index: 2;
    }
    /* Preview .lines has 16px side padding; pull the pane-wide container back to the pane edge */
    html[data-mode="preview"] .chunk-actions-container { margin-left: -16px; }
    .chunk-actions { 
      position: absolute;  
      right: 4px; 
      height: 18px;
      display: flex; 
      justify-content: center; 
      gap: 4px; 
      z-index: 2; 
    }
    .chunk-actions button { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 18px;
      padding: 0;
      border: 1px solid var(--gap);
      border-radius: 4px;
      background: var(--chrome);
      color: var(--btn-color);
      cursor: pointer; 
    }
    .chunk-actions button:hover:not(:disabled) {
      border-color: var(--btn-color);
      background: color-mix(in srgb, var(--btn-color) 20%, var(--chrome));
    }
    .chunk-actions button:disabled { opacity: 0.35; cursor: default; }
    .chunk-actions .revert { --btn-color: rgb(var(--outline-delete)); }
    .chunk-actions .stage { --btn-color: rgb(var(--outline-insert)); }
    .chunk-actions .unstage { --btn-color: var(--muted); }
    .chunk-actions svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* Staged chunks: faded fill, dashed outlines. STAGED_FILL and STAGED_OUTLINE in the script must match. */
    .staged { 
      --outline-alpha: 0.5; 
      --dash: repeating-linear-gradient(90deg, rgba(var(--outline), var(--outline-alpha)) 0 3px, transparent 3px 6px);
    }
    .staged.chunk-insert  { background-color: color-mix(in srgb, var(--chunk-insert) 25%, var(--bg)); }
    .staged.chunk-delete  { background-color: color-mix(in srgb, var(--chunk-delete) 25%, var(--bg)); }
    .staged.chunk-replace { background-color: color-mix(in srgb, var(--chunk-replace) 25%, var(--bg)); }
    /* box-shadow can't be dashed, so draw the edges as 1px gradient strips */
    .staged.chunk-start, .staged.chunk-end { box-shadow: none; background-repeat: no-repeat; background-size: 100% 1px; }
    .staged.chunk-start { background-image: var(--dash); background-position: top; }
    .staged.chunk-end { background-image: var(--dash); background-position: bottom; }
    .staged.chunk-start.chunk-end { background-image: var(--dash), var(--dash); background-position: top, bottom; }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="paths">
    <div style="flex: 0 0 10px"></div>
    <!-- &lrm; on both ends keeps leading "/" and trailing ")" from jumping sides under rtl -->
    <div class="path" title="{{pathA}}">&lrm;{{pathA}}&lrm;</div>
    <div class="mode-slot"><button id="modeToggle" hidden></button></div>
    <div class="path" title="{{pathB}}">&lrm;{{pathB}}&lrm;</div>
  </div>
  <div class="main">
    <div id="leftRuler"><div id="leftRulerViewport"></div></div>
    <div class="pane" id="leftPane"><div class="lines">{{textA}}</div></div>
    <div class="gutter">
      <canvas id="canvas"></canvas>
    </div>
    <div class="pane" id="rightPane"><div class="lines">{{textB}}</div></div>
    <div id="rightRuler"><div id="rightRulerViewport"></div></div>
  </div>

  <script>var exports = {};{{diffJs}}</script>
  <script>
    const vscode = acquireVsCodeApi();
    const leftPane = document.getElementById('leftPane');
    const rightPane = document.getElementById('rightPane');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const chunks = JSON.parse('{{chunks}}');
    const LINE_HEIGHT = 20;
    const PANE_PAD = 10;
    const rootStyle = getComputedStyle(document.documentElement);
    const OUTLINE_COLORS = Object.fromEntries(['insert', 'delete', 'replace'].map(t => [t, rootStyle.getPropertyValue(`--outline-${t}`).trim()]));
    const CHUNK_COLORS = Object.fromEntries(['insert', 'delete', 'replace'].map(t => [t, rootStyle.getPropertyValue(`--chunk-${t}`).trim()]));
    // Chunk actions: revert, stage
    const HAS_GIT_ACTIONS = JSON.parse('{{hasGitActions}}');  // boolean
    // Same symbols as VS Code's Source Control view: discard arrow, plus, minus
    const ICONS = {
      revert: '<svg viewBox="0 0 16 16"><path d="M4 6h6a3 3 0 0 1 0 6H7M6.5 3.5 4 6l2.5 2.5"/></svg>',
      stage: '<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
      unstage: '<svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg>',
    };
    const STAGED_FILL = 0.25, STAGED_OUTLINE = 0.5;
    const actionContainerEl = document.createElement('div');
    actionContainerEl.className = 'chunk-actions-container';
    if (HAS_GIT_ACTIONS) rightPane.firstElementChild.prepend(actionContainerEl);
    const actionEls = HAS_GIT_ACTIONS ? chunks.map(c => {
      const el = document.createElement('div');
      el.className = 'chunk-actions';
      const stageType = c.staged ? 'unstage' : 'stage';
      el.innerHTML = `<button class="revert" title="Revert chunk">${ICONS.revert}</button>`
        + `<button class="${stageType}" title="${c.staged ? 'Unstage' : 'Stage'} chunk">${ICONS[stageType]}</button>`;
      const [revertBtn, stageBtn] = el.children;
      revertBtn.disabled = !!c.hasStaged; // reverting the buffer would leave the staged part invisible in the index
      revertBtn.onclick = () => send({ type: 'revert', chunk: c });
      stageBtn.onclick = () => send({ type: stageType, chunk: c });
      actionContainerEl.appendChild(el);
      return el;
    }) : [];
    // The extension re-renders the whole page after an action, tab switch or mode toggle; webview state survives that reload.
    // Saved as a source line, since pixel offsets differ between raw and preview.
    const saveScroll = () => vscode?.setState({ line: midLine(rightPane), left: rightPane.scrollLeft });
    function send(msg) {
      saveScroll();
      vscode.postMessage(msg);
    }
    // Raw/Preview toggle, only for markdown pairs; the extension re-renders in the other mode
    const modeToggle = document.getElementById('modeToggle');
    modeToggle.hidden = !JSON.parse('{{isMd}}');
    modeToggle.textContent = '{{mode}}' === 'preview' ? 'Raw' : 'Preview';
    modeToggle.title = `Switch to ${modeToggle.textContent.toLowerCase()} view`;
    modeToggle.onclick = () => send({ type: 'toggleMode' });
    const IS_PREVIEW_MODE = '{{mode}}' === 'preview';
    const rows = new Map(); // pane -> [[line, offsetY], ...], sorted by line
    function buildRows(pane) {
      const lines = pane.querySelector('.lines');
      const top0 = lines.getBoundingClientRect().top;
      const byLine = new Map();
      for (const el of lines.querySelectorAll('[data-line]')) {
        const k = +el.dataset.line, y = el.getBoundingClientRect().top - top0;
        byLine.set(k, Math.min(byLine.get(k) ?? Infinity, y)); // <ul> and its first <li> share a line, keep the higher one
      }
      rows.set(pane, [...byLine].sort((p, q) => p[0] - q[0]));
    }
    // Interpolate between rows in either direction (col 0 = line, col 1 = offset); clamps past the last row.
    // Last row whose col value is <= v (0 if none); both columns are sorted, so binary search
    function rowIndex(r, v, col) {
      let lo = 0, hi = r.length - 1;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (r[mid][col] <= v) lo = mid; else hi = mid - 1;
      }
      return lo;
    }
    function interp(r, v, from) {
      const to = 1 - from, i = rowIndex(r, v, from), p = r[i], q = r[i + 1];
      if (!q || q[from] === p[from]) return p[to];
      return p[to] + (v - p[from]) / (q[from] - p[from]) * (q[to] - p[to]);
    }
    // Line k <-> pixel offset inside .lines (PANE_PAD excluded)
    const lineOffset = (pane, k) => IS_PREVIEW_MODE ? interp(rows.get(pane), k, 0) : k * LINE_HEIGHT;
    const offsetLine = (pane, y) => IS_PREVIEW_MODE ? interp(rows.get(pane), y, 1) : y / LINE_HEIGHT;
    const lineCount = pane => IS_PREVIEW_MODE ? rows.get(pane).at(-1)[0] : pane.querySelectorAll('.line').length;
    // Snap line k to a block start: down to its own block, or up to the next one
    function snapLine(pane, k, up) {
      const r = rows.get(pane), i = rowIndex(r, k, 0);
      return up && r[i][0] < k && r[i + 1] ? r[i + 1][0] : r[i][0];
    }
    // Display range of one chunk side ('a' or 'b'): blank-trimmed and snapped to whole blocks in preview
    function span(pane, c, side) {
      if (!IS_PREVIEW_MODE) return [c[side + '0'], c[side + '1']];
      const s = c['v' + side + '0'], e = c['v' + side + '1'];
      if (s === e) { const g = snapLine(pane, s, true); return [g, g]; }
      return [snapLine(pane, s, false), snapLine(pane, e, true)];
    }
    // Chunk ranges as drawn: { tag, staged, a0, a1, b0, b1 }. In preview, chunks whose snapped ranges overlap
    // on either side, or touch on both (e.g. a deleted blank line merging two paragraphs), become one,
    // so a block never gets two bands or a doubled edge.
    let drawn = [];
    function buildDrawn() {
      drawn = [];
      for (const c of chunks) {
        const [a0, a1] = span(leftPane, c, 'a'), [b0, b1] = span(rightPane, c, 'b');
        const p = drawn.at(-1);
        if (IS_PREVIEW_MODE && p && (a0 < p.a1 || b0 < p.b1 || (a0 === p.a1 && b0 === p.b1))) {
          p.tag = p.tag === c.tag ? p.tag : 'replace';
          p.staged = p.staged && c.staged;
          p.a1 = Math.max(p.a1, a1);
          p.b1 = Math.max(p.b1, b1);
        } else {
          drawn.push({ tag: c.tag, staged: c.staged, a0, a1, b0, b1 });
        }
      }
    }
    // Preview chunk backgrounds; reuses the raw view's chunk/staged classes for colors and outlines
    function drawBands(pane, side) {
      const lines = pane.querySelector('.lines');
      lines.querySelectorAll(':scope > .band').forEach(b => b.remove());
      for (const c of drawn) {
        const [s, e] = [c[side + '0'], c[side + '1']];
        const b = document.createElement('div');
        b.className = `band chunk-${c.tag} chunk-start chunk-end${c.staged ? ' staged' : ''}${s === e ? ' gap' : ''}`;
        // An end-of-file gap line sits above the boundary, matching edgesOf
        b.style.top = lineOffset(pane, s) - (s === e && s >= lineCount(pane) ? 1 : 0) + 'px';
        b.style.height = lineOffset(pane, e) - lineOffset(pane, s) + 'px';
        lines.prepend(b);
      }
    }
    // Preview word marks: diff the rendered text of the innermost blocks (p, li, tr, pre, ...) in each
    // replaced range with the raw view's diffBlock, one block per "line", then wrap the marks in place.
    function markWords() {
      const leaves = (pane, s, e) => [...pane.querySelectorAll('.lines [data-line]')]
        .filter(el => +el.dataset.line >= s && +el.dataset.line < e && !el.querySelector('[data-line]'));
      for (const d of drawn) {
        if (d.tag !== 'replace') continue;
        const A = leaves(leftPane, d.a0, d.a1), B = leaves(rightPane, d.b0, d.b1);
        const w = exports.diffBlock(A.map(el => el.textContent), B.map(el => el.textContent));
        A.forEach((el, i) => wrapMarks(el, w.a[i]));
        B.forEach((el, j) => wrapMarks(el, w.b[j]));
      }
    }
    // Wrap textContent ranges [s, e) of el in spans; an empty range gets a zero-width gap span.
    // Ranges may cross inline tags (<strong>, <code>), so each text node segment is wrapped on its own.
    const STRUCTURAL = new Set(['TR', 'THEAD', 'TBODY', 'TABLE', 'UL', 'OL']);  // a span directly inside these breaks layout
    function wrapMarks(el, marks) {
      for (const [s, e, cls] of marks) {
        const hits = [];
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        for (let n, off = 0; (n = walker.nextNode()); off += n.length) {
          if (STRUCTURAL.has(n.parentElement.tagName)) continue;
          if (s === e) {
            if (s >= off && s <= off + n.length) { hits.push([n, s - off, s - off]); break; }
          } else {
            const a = Math.max(s, off) - off, b = Math.min(e, off + n.length) - off;
            if (a < b && /\S/.test(n.data.slice(a, b))) hits.push([n, a, b]);
          }
        }
        for (const [n, a, b] of hits) {
          const span = document.createElement('span');
          span.className = cls;
          const mid = n.splitText(a);
          if (a === b) { mid.before(span); continue; }
          mid.splitText(b - a);
          mid.replaceWith(span);
          span.append(mid);
        }
      }
    }
    // Re-measure and redraw everything positioned from line offsets
    function layout() {
      if (IS_PREVIEW_MODE) {
        buildRows(leftPane);
        buildRows(rightPane);
      }
      buildDrawn();
      if (IS_PREVIEW_MODE) {
        drawBands(leftPane, 'a');
        drawBands(rightPane, 'b');
      }
      actionEls.forEach((el, i) => {
        el.style.top = Math.max(-PANE_PAD, lineOffset(rightPane, span(rightPane, chunks[i], 'b')[0]) - 18 - 1) + 'px';
      });
      drawRulerMarks();
      resizeCanvas();
    }
    // Ctrl/Cmd+Z undoes the last revert button click; the extension owns that history
    if (HAS_GIT_ACTIONS) window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        send({ type: 'undo' });
      }
    });

    // Draw ruler marks & viewports; marks are redrawn on every layout()
    function drawRulerMarks() {
      const sides = [[document.getElementById('leftRuler'), leftPane, 'a'], [document.getElementById('rightRuler'), rightPane, 'b']];
      for (const [ruler, pane, side] of sides) {
        ruler.querySelectorAll('.ruler-mark').forEach(m => m.remove());
        const n = lineCount(pane);
        // Raw: line fraction. Preview: pixel fraction, since blocks have different heights.
        const frac = k => IS_PREVIEW_MODE ? (PANE_PAD + lineOffset(pane, k)) / pane.scrollHeight : k / n;
        for (const c of drawn) {
          const [s, e] = [c[side + '0'], c[side + '1']];
          if (s === e) continue;  // only draw marks for non-empty chunks
          const m = document.createElement('div');
          m.className = `ruler-mark ruler-mark-${c.tag}`;
          m.style.top = frac(s) * 100 + '%';
          m.style.height = (frac(e) - frac(s)) * 100 + '%';
          ruler.appendChild(m);
        }
      }
    }
    function drawRulerViewports() {
      const leftViewport = document.getElementById('leftRulerViewport');
      const rightViewport = document.getElementById('rightRulerViewport');
      leftViewport.style.top = leftPane.scrollTop / leftPane.scrollHeight * 100 + '%';
      leftViewport.style.height = leftPane.clientHeight / leftPane.scrollHeight * 100 + '%';
      rightViewport.style.top = rightPane.scrollTop / rightPane.scrollHeight * 100 + '%';
      rightViewport.style.height = rightPane.clientHeight / rightPane.scrollHeight * 100 + '%';
    }
    function jumpTo(e, ruler, pane) {
      const r = ruler.getBoundingClientRect();
      pane.scrollTop = (e.clientY - r.top) / r.height * pane.scrollHeight - pane.clientHeight / 2;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.parentElement.clientWidth * dpr;
      canvas.height = canvas.parentElement.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawConnections();
      drawRulerViewports();
    }

    // Line boundary k (top of line k) in viewport pixels
    const yOf = (pane, k) => PANE_PAD + lineOffset(pane, k) - pane.scrollTop;

    // Top/bottom curve y for a chunk side, centered on the 1px inset outline drawn in the pane:
    // chunk-start/gap-before sit just below the boundary, chunk-end/gap-after just above it.
    function edgesOf(pane, s, e) {
      if (s < e) return [yOf(pane, s) + 0.5, yOf(pane, e) - 0.5];
      const y = yOf(pane, s) + (s < lineCount(pane) ? 0.5 : -0.5);
      return [y, y];
    }

    // Each chunk is a filled band whose edges are Bezier curves joining the left and right line ranges.
    function drawConnections() {
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, w, h);
      for (const [i, c] of drawn.entries()) {
        const [ly0, ly1] = edgesOf(leftPane, c.a0, c.a1);
        const [ry0, ry1] = edgesOf(rightPane, c.b0, c.b1);
        // Draw the chunk actions buttons
        // if (actionEls[i]) actionEls[i].style.top = Math.min(ly0, ry0) + 'px';
        // Skip chunks that are off-screen
        if (Math.max(ly1, ry1) < 0 || Math.min(ly0, ry0) > h) continue;
        const rgb = OUTLINE_COLORS[c.tag];
        ctx.beginPath();
        ctx.moveTo(0, ly0);
        ctx.bezierCurveTo(w / 2, ly0, w / 2, ry0, w, ry0);
        ctx.lineTo(w, ry1);
        ctx.bezierCurveTo(w / 2, ry1, w / 2, ly1, 0, ly1);
        ctx.closePath();
        ctx.fillStyle = CHUNK_COLORS[c.tag];
        // Staged chunks are faded with dashed edges; set for every chunk since ctx keeps them
        ctx.globalAlpha = c.staged ? STAGED_FILL : 1;
        ctx.setLineDash(c.staged ? [3, 3] : []);
        ctx.fill();
        ctx.globalAlpha = c.staged ? STAGED_OUTLINE : 1;
        // Stroke only the top and bottom curves. The left and right edges stay unstroked.
        ctx.beginPath();
        ctx.moveTo(0, ly0);
        ctx.bezierCurveTo(w / 2, ly0, w / 2, ry0, w, ry0);
        ctx.moveTo(0, ly1);
        ctx.bezierCurveTo(w / 2, ly1, w / 2, ry1, w, ry1);
        ctx.strokeStyle = `rgb(${rgb})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Matching line boundaries on both sides; between them, lines map linearly.
    // Unchanged stretches map 1:1, so inside a chunk the side with fewer lines moves slower.
    const anchors = [[0, 0], ...chunks.flatMap(c => [[c.a0, c.b0], [c.a1, c.b1]])];

    // Map a fractional line position from one side (0 = left, 1 = right) to the other.
    function mapLine(line, from) {
      const to = 1 - from;
      let i = 0;
      while (i + 1 < anchors.length && anchors[i + 1][from] <= line) i++;
      const [p, q] = [anchors[i], anchors[i + 1]];
      if (!q) return p[to] + (line - p[from]);
      return p[to] + (line - p[from]) / (q[from] - p[from]) * (q[to] - p[to]);
    }

    // Sync on the line at the vertical middle of the viewport.
    const midLine = pane => offsetLine(pane, pane.scrollTop + pane.clientHeight / 2 - PANE_PAD);
    const expected = new Map();
    function syncFrom(src, dst, from) {
      // Ignore the scroll event our own assignment below triggers on dst.
      const e = expected.get(src);
      if (e && Math.abs(src.scrollTop - e[0]) < 1 && Math.abs(src.scrollLeft - e[1]) < 1) {
        expected.delete(src);
      } else {
        syncTo(src, dst, from);
      }
      scheduleDraw();
    }
    function syncTo(src, dst, from) {
      const [top, left] = [dst.scrollTop, dst.scrollLeft];
      dst.scrollTop = PANE_PAD + lineOffset(dst, mapLine(midLine(src), from)) - dst.clientHeight / 2;
      dst.scrollLeft = src.scrollLeft;
      if (dst.scrollTop !== top || dst.scrollLeft !== left) expected.set(dst, [dst.scrollTop, dst.scrollLeft]);
    }

    // One listener for the whole view. The pointer's half picks the driver pane; the other
    // pane follows through the line map. Native wheel is blocked so both panes and the canvas
    // update in the same frame, instead of the compositor painting the panes a frame ahead.
    let wheel = null;
    window.addEventListener('wheel', e => {
      e.preventDefault();
      const fromLeft = e.clientX < window.innerWidth / 2;
      const src = fromLeft ? leftPane : rightPane;
      const k = e.deltaMode === 1 ? LINE_HEIGHT : e.deltaMode === 2 ? src.clientHeight : 1;
      if (!wheel) {
        wheel = { dx: 0, dy: 0 };
        requestAnimationFrame(applyWheel);
      }
      wheel.src = src;
      wheel.dst = fromLeft ? rightPane : leftPane;
      wheel.from = fromLeft ? 0 : 1;
      wheel.dx += e.deltaX * k;
      wheel.dy += e.deltaY * k;
    }, { capture: true, passive: false });
    function applyWheel() {
      const { src, dst, from, dx, dy } = wheel;
      wheel = null;
      const [top, left] = [src.scrollTop, src.scrollLeft];
      src.scrollTop += dy;
      src.scrollLeft += dx;
      if (src.scrollTop !== top || src.scrollLeft !== left) expected.set(src, [src.scrollTop, src.scrollLeft]);
      syncTo(src, dst, from);
      drawConnections();
      drawRulerViewports();
    }

    // Both panes fire scroll events per user scroll; draw once per frame.
    let drawPending = false;
    function scheduleDraw() {
      if (drawPending) return;
      drawPending = true;
      requestAnimationFrame(() => { 
        drawPending = false; 
        drawConnections(); 
        drawRulerViewports();
        saveScroll();
      });
    }
    leftPane.addEventListener('scroll', () => syncFrom(leftPane, rightPane, 0));
    rightPane.addEventListener('scroll', () => syncFrom(rightPane, leftPane, 1));
    // Rulers
    leftRuler.addEventListener('pointerdown', (e) => {
      leftRuler.setPointerCapture(e.pointerId);
      jumpTo(e, leftRuler, leftPane);
    });
    leftRuler.addEventListener('pointermove', (e) => {
      if (leftRuler.hasPointerCapture(e.pointerId)) jumpTo(e, leftRuler, leftPane);
    });
    rightRuler.addEventListener('pointerdown', (e) => {
      rightRuler.setPointerCapture(e.pointerId);
      jumpTo(e, rightRuler, rightPane);
    });
    rightRuler.addEventListener('pointermove', (e) => {
      if (rightRuler.hasPointerCapture(e.pointerId)) jumpTo(e, rightRuler, rightPane);
    });
    window.addEventListener('resize', resizeCanvas);
    // Rows must exist before the first scroll sync or draw reads them
    layout();
    // Once: wrapping words adds no text, so later re-layouts keep them
    if (IS_PREVIEW_MODE) markWords();
    // Images loading and width changes move preview blocks; re-measure when either side resizes
    const resizeObserver = new ResizeObserver(layout);
    resizeObserver.observe(leftPane.querySelector('.lines'));
    resizeObserver.observe(rightPane.querySelector('.lines'));
    // Restore the line saved by send() to the middle of the viewport; the scroll listener above syncs the left pane.
    const saved = vscode?.getState();
    if (saved) {
      rightPane.scrollTop = PANE_PAD + lineOffset(rightPane, saved.line ?? 0) - rightPane.clientHeight / 2;
      rightPane.scrollLeft = saved.left;
    }
    setTimeout(resizeCanvas, 100);
  </script>
</body>

</html>
