<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    body {
      display: flex;
      font-family: monospace;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      overflow: hidden;
    }

    .pane {
      flex: 0 0 calc(50% - 30px); /* half width minus half gutter */
      width: calc(50% - 30px);
      min-width: 0;
      overflow: auto;
      padding: 10px;
      white-space: pre;
      position: relative;
      box-sizing: border-box;
    }

    /* LINE_HEIGHT and PANE_PAD in the script must match these */
    .line {
      height: 20px;
      line-height: 20px;
    }

    /* As wide as the longest line, so every row's background spans the full scroll width */
    .lines {
      width: max-content;
      min-width: 100%;
    }

    .line-num {
      display: inline-block;
      width: 5ch;
      margin-right: 1ch;
      text-align: right;
      color: #858585;
      user-select: none;
    }

    .chunk-insert { background: rgba(140, 200, 140, 0.2); }
    .chunk-delete { background: rgba(240, 140, 140, 0.2); }
    .chunk-replace { background: rgba(140, 180, 240, 0.2); }
    .word-change { background: rgba(110, 160, 250, 0.5); border-radius: 2px; }
    .gap-before { box-shadow: inset 0 1px 0 rgba(200, 200, 200, 0.8); }
    .gap-after { box-shadow: inset 0 -1px 0 rgba(200, 200, 200, 0.8); }

    /* The fluid gutter holding our connecting curves */
    .gutter {
      flex: 0 0 60px;
      width: 60px;
      background: #252526;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="pane" id="leftPane"><div class="lines">{{oldText}}</div></div>
  <div class="gutter">
    <canvas id="canvas"></canvas>
  </div>
  <div class="pane" id="rightPane"><div class="lines">{{newText}}</div></div>

  <script>
    const leftPane = document.getElementById('leftPane');
    const rightPane = document.getElementById('rightPane');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const chunks = {{chunks}};
    const LINE_HEIGHT = 20;
    const PANE_PAD = 10;
    const COLORS = {
      insert: [140, 200, 140],
      delete: [240, 140, 140],
      replace: [140, 180, 240],
    };

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.parentElement.clientWidth * dpr;
      canvas.height = canvas.parentElement.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawConnections();
    }

    // Line boundary k (top of line k) in viewport pixels; lines have fixed height, so no DOM lookups.
    const yOf = (pane, k) => PANE_PAD + k * LINE_HEIGHT - pane.scrollTop;

    // Each chunk is a filled band whose edges are Bezier curves joining the left and right line ranges.
    function drawConnections() {
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, w, h);
      for (const c of chunks) {
        const ly0 = yOf(leftPane, c.a0), ly1 = yOf(leftPane, c.a1);
        const ry0 = yOf(rightPane, c.b0), ry1 = yOf(rightPane, c.b1);
        if (Math.max(ly1, ry1) < 0 || Math.min(ly0, ry0) > h) continue;
        const [r, g, b] = COLORS[c.tag];
        ctx.beginPath();
        ctx.moveTo(0, ly0);
        ctx.bezierCurveTo(w / 2, ly0, w / 2, ry0, w, ry0);
        ctx.lineTo(w, ry1);
        ctx.bezierCurveTo(w / 2, ry1, w / 2, ly1, 0, ly1);
        ctx.closePath();
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.3)`;
        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
      }
    }

    // Synchronize scrolling between left and right panes
    leftPane.addEventListener('scroll', () => {
      rightPane.scrollTop = leftPane.scrollTop;
      drawConnections();
    });
    rightPane.addEventListener('scroll', () => {
      leftPane.scrollTop = rightPane.scrollTop;
      drawConnections();
    });

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
  </script>
</body>

</html>
